version: 1

frontend:
  phases:
    preBuild:
      commands:
        - npm ci

    build:
      commands:
        - env | grep -e DATABASE_URL >> .env.production
        - env | grep -e ACCESS_KEY_ID >> .env.production
        - env | grep -e SECRET_ACCESS_KEY >> .env.production
        - env | grep -e BUCKET_NAME >> .env.production
        - env | grep -e REGION_NAME >> .env.production
        - env | grep '^PLAYLIST_BUCKET_NAME=' >> .env.production
        - env | grep '^PLAYER_MANIFEST_PUBLIC_BASE_URL=' >> .env.production
        - env | grep '^PLAYER_CDN_URL=' >> .env.production
        - env | grep '^PLAYER_WEBSOCKET_URL=' >> .env.production
        - |
          for variable in RABBITMQ_ENABLED RABBITMQ_URL RABBITMQ_PLAYLIST_RENDER_QUEUE; do
            if value="$(printenv "$variable")"; then
              printf '%s=%s\n' "$variable" "$value" >> .env.production
              echo "Loaded $variable for the CMS runtime."
            else
              echo "WARNING: $variable is not available in the Amplify build environment."
            fi
          done
        - npm run build

  artifacts:
    baseDirectory: .next
    files:
      - '**/*'

  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
